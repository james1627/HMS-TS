[tools]
node = '24'
bun = "1.3.14"

[hooks]
# Automatically runs 'bun install' whenever you switch into this directory or tools change
postinstall = "bun install"

[tasks]
# Defines scannable, reproducible project tasks using Bun
dev = "bun run dev"
build = "bun run build"
test = "bun wtf test"
lint = "bun prettier src/ --write"
