<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectVault - Project & Receipt Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/fontsource-inter@5.0.0/index.css"
    />
    <style>
      * {
        font-family: "Inter", sans-serif;
      }
      .fade-in {
        animation: fadeIn 0.3s ease-in;
      }
      .slide-up {
        animation: slideUp 0.3s ease-out;
      }
      .slide-right {
        animation: slideRight 0.3s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideRight {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      .glass {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
      }
      .gradient-bg {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .card-hover {
        transition: all 0.3s ease;
      }
      .card-hover:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      }
      .receipt-thumb {
        transition: transform 0.2s;
      }
      .receipt-thumb:hover {
        transform: scale(1.05);
      }
      .modal-overlay {
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #c4b5fd;
        border-radius: 3px;
      }
      .status-badge {
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 9999px;
        font-weight: 600;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        ring: 2px;
        border-color: #7c3aed;
      }
      .sidebar-link {
        transition: all 0.2s;
      }
      .sidebar-link:hover,
      .sidebar-link.active {
        background: rgba(124, 58, 237, 0.1);
        color: #7c3aed;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div id="app"></div>

    <script>
      // ============ DATA LAYER ============
      const DB = {
        getUsers: () => JSON.parse(localStorage.getItem("pv_users") || "[]"),
        saveUsers: (u) => localStorage.setItem("pv_users", JSON.stringify(u)),
        getCurrentUser: () =>
          JSON.parse(localStorage.getItem("pv_current_user") || "null"),
        setCurrentUser: (u) =>
          localStorage.setItem("pv_current_user", JSON.stringify(u)),
        getProjects: (uid) =>
          JSON.parse(localStorage.getItem(`pv_projects_${uid}`) || "[]"),
        saveProjects: (uid, p) =>
          localStorage.setItem(`pv_projects_${uid}`, JSON.stringify(p)),
        getReceipts: (uid, pid) =>
          JSON.parse(localStorage.getItem(`pv_receipts_${uid}_${pid}`) || "[]"),
        saveReceipts: (uid, pid, r) =>
          localStorage.setItem(`pv_receipts_${uid}_${pid}`, JSON.stringify(r)),
      };

      // Seed demo user
      (function seed() {
        const users = DB.getUsers();
        if (!users.find((u) => u.email === "demo@projectvault.com")) {
          users.push({
            id: "demo1",
            name: "Demo User",
            email: "demo@projectvault.com",
            password: "demo123",
          });
          DB.saveUsers(users);
        }
      })();

      // ============ STATE ============
      let state = {
        view: "login", // login, register, dashboard, projects, receipts, project-detail
        user: DB.getCurrentUser(),
        projects: [],
        selectedProject: null,
        modal: null, // 'add-project', 'edit-project', 'view-receipt', 'add-receipt'
        editingProject: null,
        filter: "all",
        searchQuery: "",
        sidebarOpen: false,
      };

      function setState(updates) {
        Object.assign(state, updates);
        render();
      }

      // ============ AUTH ============
      function login(email, password) {
        const users = DB.getUsers();
        const user = users.find(
          (u) => u.email === email && u.password === password,
        );
        if (user) {
          DB.setCurrentUser(user);
          state.user = user;
          state.projects = DB.getProjects(user.id);
          setState({ view: "dashboard", modal: null });
        } else {
          alert("Invalid email or password");
        }
      }

      function register(name, email, password) {
        const users = DB.getUsers();
        if (users.find((u) => u.email === email)) {
          alert("Email already registered");
          return;
        }
        const user = { id: "u_" + Date.now(), name, email, password };
        users.push(user);
        DB.saveUsers(users);
        DB.setCurrentUser(user);
        state.user = user;
        state.projects = [];
        setState({ view: "dashboard", modal: null });
      }

      function logout() {
        localStorage.removeItem("pv_current_user");
        state.user = null;
        state.projects = [];
        setState({ view: "login", modal: null });
      }

      // ============ PROJECTS ============
      function addProject(project) {
        const uid = state.user.id;
        project.id = "p_" + Date.now();
        project.createdAt = new Date().toISOString();
        project.status = "active";
        state.projects.push(project);
        DB.saveProjects(uid, state.projects);
        setState({ modal: null });
      }

      function updateProject(updated) {
        const uid = state.user.id;
        state.projects = state.projects.map((p) =>
          p.id === updated.id ? updated : p,
        );
        DB.saveProjects(uid, state.projects);
        setState({ modal: null });
      }

      function deleteProject(id) {
        if (!confirm("Delete this project and all its receipts?")) return;
        const uid = state.user.id;
        state.projects = state.projects.filter((p) => p.id !== id);
        DB.saveProjects(uid, state.projects);
        localStorage.removeItem(`pv_receipts_${uid}_${id}`);
        if (state.selectedProject?.id === id) state.selectedProject = null;
        setState({ view: "projects", modal: null });
      }

      // ============ RECEIPTS ============
      function addReceipt(projectId, receipt) {
        const uid = state.user.id;
        const receipts = DB.getReceipts(uid, projectId);
        receipt.id = "r_" + Date.now();
        receipt.createdAt = new Date().toISOString();
        receipts.push(receipt);
        DB.saveReceipts(uid, projectId, receipts);
        setState({ modal: null });
      }

      function deleteReceipt(projectId, receiptId) {
        if (!confirm("Delete this receipt?")) return;
        const uid = state.user.id;
        const receipts = DB.getReceipts(uid, projectId).filter(
          (r) => r.id !== receiptId,
        );
        DB.saveReceipts(uid, projectId, receipts);
        setState({ modal: null });
      }

      // ============ HELPERS ============
      function formatCurrency(n) {
        return (
          "$" +
          Number(n || 0)
            .toFixed(2)
            .replace(/\B(?=(\d{3})+(?!\d))/g, ",")
        );
      }

      function formatDate(d) {
        return new Date(d).toLocaleDateString("en-US", {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }

      function getReceiptCount(pid) {
        return DB.getReceipts(state.user.id, pid).length;
      }

      function getTotalSpent(pid) {
        const receipts = DB.getReceipts(state.user.id, pid);
        return receipts.reduce((s, r) => s + (Number(r.amount) || 0), 0);
      }

      function getStatusColor(status) {
        const map = {
          active: "bg-green-100 text-green-700",
          completed: "bg-blue-100 text-blue-700",
          paused: "bg-yellow-100 text-yellow-700",
          cancelled: "bg-red-100 text-red-700",
        };
        return map[status] || "bg-gray-100 text-gray-700";
      }

      // ============ RENDER ============
      function render() {
        const app = document.getElementById("app");
        if (!state.user) {
          app.innerHTML =
            state.view === "register" ? renderRegister() : renderLogin();
        } else {
          app.innerHTML = renderApp();
        }
        attachHandlers();
      }

      // ============ LOGIN VIEW ============
      function renderLogin() {
        return `
  <div class="min-h-screen gradient-bg flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 fade-in">
      <div class="text-center mb-8">
        <img src="https://image.qwenlm.ai/public_source/f1b6da29-5264-4459-828a-a835d4e09185/1eba43461-7cc3-4015-8fbe-551146a938ca.png" class="w-16 h-16 mx-auto mb-4" alt="logo">
        <h1 class="text-3xl font-bold text-gray-900">ProjectVault</h1>
        <p class="text-gray-500 mt-2">Manage projects, prices & receipts</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="loginEmail" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" placeholder="you@example.com" value="demo@projectvault.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" placeholder="••••••••" value="demo123">
        </div>
        <button type="submit" class="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90 transition shadow-lg">Sign In</button>
      </form>
      <div class="mt-6 text-center">
        <p class="text-gray-500 text-sm">Don't have an account? <button id="goRegister" class="text-purple-600 font-semibold hover:underline">Sign up</button></p>
      </div>
      <div class="mt-4 p-3 bg-purple-50 rounded-lg text-xs text-purple-700 text-center">
        <strong>Demo:</strong> demo@projectvault.com / demo123
      </div>
    </div>
  </div>`;
      }

      // ============ REGISTER VIEW ============
      function renderRegister() {
        return `
  <div class="min-h-screen gradient-bg flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 fade-in">
      <div class="text-center mb-8">
        <img src="https://image.qwenlm.ai/public_source/f1b6da29-5264-4459-828a-a835d4e09185/1eba43461-7cc3-4015-8fbe-551146a938ca.png" class="w-16 h-16 mx-auto mb-4" alt="logo">
        <h1 class="text-3xl font-bold text-gray-900">Create Account</h1>
        <p class="text-gray-500 mt-2">Start managing your projects today</p>
      </div>
      <form id="registerForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
          <input type="text" id="regName" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" placeholder="John Doe">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="regEmail" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" placeholder="you@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" id="regPassword" required minlength="6" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90 transition shadow-lg">Create Account</button>
      </form>
      <div class="mt-6 text-center">
        <p class="text-gray-500 text-sm">Already have an account? <button id="goLogin" class="text-purple-600 font-semibold hover:underline">Sign in</button></p>
      </div>
    </div>
  </div>`;
      }

      // ============ MAIN APP ============
      function renderApp() {
        const projects = state.projects;
        const totalProjects = projects.length;
        const totalValue = projects.reduce(
          (s, p) => s + (Number(p.price) || 0),
          0,
        );
        const totalReceipts = projects.reduce(
          (s, p) => s + getReceiptCount(p.id),
          0,
        );
        const activeProjects = projects.filter(
          (p) => p.status === "active",
        ).length;

        return `
  <div class="flex min-h-screen">
    ${renderSidebar()}
    <div class="flex-1 flex flex-col min-h-screen">
      ${renderHeader()}
      <main class="flex-1 p-4 md:p-8 overflow-auto">
        ${state.view === "dashboard" ? renderDashboard(totalProjects, totalValue, totalReceipts, activeProjects) : ""}
        ${state.view === "projects" ? renderProjectsView() : ""}
        ${state.view === "project-detail" ? renderProjectDetail() : ""}
      </main>
    </div>
    ${state.modal ? renderModal() : ""}
  </div>`;
      }

      function renderSidebar() {
        return `
  <aside class="${state.sidebarOpen ? "fixed inset-y-0 left-0 z-50 w-64" : "hidden"} md:relative md:flex md:flex-col md:w-64 bg-white border-r border-gray-200 slide-right">
    <div class="p-6 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <img src="https://image.qwenlm.ai/public_source/f1b6da29-5264-4459-828a-a835d4e09185/1eba43461-7cc3-4015-8fbe-551146a938ca.png" class="w-10 h-10" alt="logo">
        <div>
          <h1 class="font-bold text-gray-900 text-lg">ProjectVault</h1>
          <p class="text-xs text-gray-500">Project Manager</p>
        </div>
      </div>
    </div>
    <nav class="flex-1 p-4 space-y-1">
      <button onclick="navigateTo('dashboard')" class="sidebar-link w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${state.view === "dashboard" ? "active bg-purple-50 text-purple-700" : "text-gray-600"}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        Dashboard
      </button>
      <button onclick="navigateTo('projects')" class="sidebar-link w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium ${state.view === "projects" || state.view === "project-detail" ? "active bg-purple-50 text-purple-700" : "text-gray-600"}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        Projects
      </button>
    </nav>
    <div class="p-4 border-t border-gray-100">
      <div class="flex items-center gap-3 px-4 py-3">
        <div class="w-9 h-9 rounded-full gradient-bg flex items-center justify-center text-white font-bold text-sm">${state.user.name.charAt(0).toUpperCase()}</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-gray-900 truncate">${state.user.name}</p>
          <p class="text-xs text-gray-500 truncate">${state.user.email}</p>
        </div>
      </div>
      <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-2 rounded-lg text-sm font-medium text-red-600 hover:bg-red-50 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Sign Out
      </button>
    </div>
  </aside>
  ${state.sidebarOpen ? '<div class="fixed inset-0 bg-black/30 z-40 md:hidden" onclick="toggleSidebar()"></div>' : ""}`;
      }

      function renderHeader() {
        const titles = {
          dashboard: "Dashboard",
          projects: "Projects",
          "project-detail": state.selectedProject?.name || "Project",
        };
        return `
  <header class="bg-white border-b border-gray-200 px-4 md:px-8 py-4 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-4">
      <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg hover:bg-gray-100">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h2 class="text-xl font-bold text-gray-900">${titles[state.view] || "Dashboard"}</h2>
    </div>
    <div class="flex items-center gap-3">
      ${
        state.view === "projects"
          ? `<button onclick="openAddProject()" class="gradient-bg text-white px-4 py-2 rounded-lg text-sm font-semibold hover:opacity-90 transition flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        New Project
      </button>`
          : ""
      }
    </div>
  </header>`;
      }

      function renderDashboard(
        totalProjects,
        totalValue,
        totalReceipts,
        activeProjects,
      ) {
        const recentProjects = [...state.projects]
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
          .slice(0, 5);
        return `
  <div class="fade-in space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      ${statCard("Total Projects", totalProjects, "📁", "from-purple-500 to-indigo-500")}
      ${statCard("Total Value", formatCurrency(totalValue), "💰", "from-emerald-500 to-teal-500")}
      ${statCard("Active Projects", activeProjects, "⚡", "from-amber-500 to-orange-500")}
      ${statCard("Total Receipts", totalReceipts, "🧾", "from-pink-500 to-rose-500")}
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 bg-white rounded-xl border border-gray-200 p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-gray-900">Recent Projects</h3>
          <button onclick="navigateTo('projects')" class="text-sm text-purple-600 font-medium hover:underline">View all →</button>
        </div>
        ${
          recentProjects.length === 0
            ? `<div class="text-center py-12 text-gray-400">
          <svg class="w-16 h-16 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
          <p>No projects yet. Create your first one!</p>
        </div>`
            : `<div class="space-y-3">${recentProjects
                .map(
                  (p) => `
          <div onclick="viewProject('${p.id}')" class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-50 cursor-pointer transition">
            <div class="w-10 h-10 rounded-lg gradient-bg flex items-center justify-center text-white font-bold text-sm">${p.name.charAt(0).toUpperCase()}</div>
            <div class="flex-1 min-w-0">
              <p class="font-medium text-gray-900 truncate">${p.name}</p>
              <p class="text-xs text-gray-500">${p.category || "Uncategorized"}</p>
            </div>
            <span class="status-badge ${getStatusColor(p.status)}">${p.status}</span>
            <p class="font-semibold text-gray-900">${formatCurrency(p.price)}</p>
          </div>
        `,
                )
                .join("")}</div>`
        }
      </div>
      <div class="bg-white rounded-xl border border-gray-200 p-6">
        <h3 class="font-semibold text-gray-900 mb-4">Quick Actions</h3>
        <div class="space-y-3">
          <button onclick="openAddProject()" class="w-full flex items-center gap-3 p-3 rounded-lg border border-gray-200 hover:border-purple-300 hover:bg-purple-50 transition text-left">
            <span class="text-2xl">➕</span>
            <div><p class="font-medium text-gray-900 text-sm">New Project</p><p class="text-xs text-gray-500">Add a project with pricing</p></div>
          </button>
          <button onclick="navigateTo('projects')" class="w-full flex items-center gap-3 p-3 rounded-lg border border-gray-200 hover:border-purple-300 hover:bg-purple-50 transition text-left">
            <span class="text-2xl"></span>
            <div><p class="font-medium text-gray-900 text-sm">View Projects</p><p class="text-xs text-gray-500">Manage all projects</p></div>
          </button>
        </div>
      </div>
    </div>
  </div>`;
      }

      function statCard(label, value, icon, gradient) {
        return `
  <div class="bg-white rounded-xl border border-gray-200 p-5 card-hover">
    <div class="flex items-center justify-between mb-3">
      <span class="text-3xl">${icon}</span>
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br ${gradient} opacity-20"></div>
    </div>
    <p class="text-2xl font-bold text-gray-900">${value}</p>
    <p class="text-sm text-gray-500 mt-1">${label}</p>
  </div>`;
      }

      function renderProjectsView() {
        let filtered = state.projects;
        if (state.filter !== "all")
          filtered = filtered.filter((p) => p.status === state.filter);
        if (state.searchQuery) {
          const q = state.searchQuery.toLowerCase();
          filtered = filtered.filter(
            (p) =>
              p.name.toLowerCase().includes(q) ||
              (p.category || "").toLowerCase().includes(q),
          );
        }
        filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        return `
  <div class="fade-in space-y-4">
    <div class="flex flex-col md:flex-row gap-3">
      <div class="flex-1 relative">
        <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="searchInput" placeholder="Search projects..." value="${state.searchQuery}" class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition">
      </div>
      <select id="filterSelect" class="px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent bg-white">
        <option value="all" ${state.filter === "all" ? "selected" : ""}>All Status</option>
        <option value="active" ${state.filter === "active" ? "selected" : ""}>Active</option>
        <option value="completed" ${state.filter === "completed" ? "selected" : ""}>Completed</option>
        <option value="paused" ${state.filter === "paused" ? "selected" : ""}>Paused</option>
        <option value="cancelled" ${state.filter === "cancelled" ? "selected" : ""}>Cancelled</option>
      </select>
    </div>
    ${
      filtered.length === 0
        ? `
    <div class="bg-white rounded-xl border border-gray-200 p-12 text-center">
      <svg class="w-20 h-20 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
      <h3 class="text-lg font-semibold text-gray-900 mb-2">${state.projects.length === 0 ? "No projects yet" : "No matching projects"}</h3>
      <p class="text-gray-500 mb-4">${state.projects.length === 0 ? "Create your first project to get started" : "Try adjusting your search or filter"}</p>
      ${state.projects.length === 0 ? `<button onclick="openAddProject()" class="gradient-bg text-white px-6 py-2.5 rounded-lg font-semibold hover:opacity-90 transition">Create Project</button>` : ""}
    </div>`
        : `
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${filtered.map((p) => renderProjectCard(p)).join("")}
    </div>`
    }
  </div>`;
      }

      function renderProjectCard(p) {
        const receiptCount = getReceiptCount(p.id);
        const spent = getTotalSpent(p.id);
        const budget = Number(p.price) || 0;
        const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
        return `
  <div class="bg-white rounded-xl border border-gray-200 p-5 card-hover cursor-pointer" onclick="viewProject('${p.id}')">
    <div class="flex items-start justify-between mb-3">
      <div class="w-12 h-12 rounded-xl gradient-bg flex items-center justify-center text-white font-bold text-lg">${p.name.charAt(0).toUpperCase()}</div>
      <span class="status-badge ${getStatusColor(p.status)}">${p.status}</span>
    </div>
    <h3 class="font-semibold text-gray-900 mb-1 truncate">${p.name}</h3>
    <p class="text-xs text-gray-500 mb-3">${p.category || "Uncategorized"} · ${formatDate(p.createdAt)}</p>
    <div class="mb-3">
      <div class="flex justify-between text-xs mb-1">
        <span class="text-gray-500">Budget used</span>
        <span class="font-medium text-gray-700">${formatCurrency(spent)} / ${formatCurrency(budget)}</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2">
        <div class="h-2 rounded-full gradient-bg transition-all" style="width: ${pct}%"></div>
      </div>
    </div>
    <div class="flex items-center justify-between pt-3 border-t border-gray-100">
      <div class="flex items-center gap-1 text-xs text-gray-500">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        ${receiptCount} receipt${receiptCount !== 1 ? "s" : ""}
      </div>
      <p class="font-bold text-gray-900">${formatCurrency(budget)}</p>
    </div>
  </div>`;
      }

      function renderProjectDetail() {
        const p = state.selectedProject;
        if (!p)
          return '<div class="text-center py-12 text-gray-500">Project not found</div>';
        const receipts = DB.getReceipts(state.user.id, p.id);
        const spent = getTotalSpent(p.id);
        const budget = Number(p.price) || 0;
        const remaining = budget - spent;

        return `
  <div class="fade-in space-y-6">
    <button onclick="navigateTo('projects')" class="flex items-center gap-2 text-sm text-gray-600 hover:text-purple-600 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      Back to Projects
    </button>
    <div class="bg-white rounded-xl border border-gray-200 p-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 rounded-xl gradient-bg flex items-center justify-center text-white font-bold text-2xl">${p.name.charAt(0).toUpperCase()}</div>
          <div>
            <h2 class="text-2xl font-bold text-gray-900">${p.name}</h2>
            <p class="text-gray-500 text-sm">${p.category || "Uncategorized"} · Created ${formatDate(p.createdAt)}</p>
            <span class="status-badge ${getStatusColor(p.status)} mt-2 inline-block">${p.status}</span>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="openEditProject('${p.id}')" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-50 transition flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            Edit
          </button>
          <button onclick="deleteProject('${p.id}')" class="px-4 py-2 border border-red-300 text-red-600 rounded-lg text-sm font-medium hover:bg-red-50 transition flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            Delete
          </button>
        </div>
      </div>
      ${p.description ? `<p class="mt-4 text-gray-600">${p.description}</p>` : ""}
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      ${statCard("Budget", formatCurrency(budget), "💰", "from-purple-500 to-indigo-500")}
      ${statCard("Spent", formatCurrency(spent), "📊", "from-rose-500 to-pink-500")}
      ${statCard("Remaining", formatCurrency(remaining), "🎯", "from-emerald-500 to-teal-500")}
    </div>
    <div class="bg-white rounded-xl border border-gray-200 p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-gray-900">Receipts (${receipts.length})</h3>
        <button onclick="openAddReceipt('${p.id}')" class="gradient-bg text-white px-4 py-2 rounded-lg text-sm font-semibold hover:opacity-90 transition flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Add Receipt
        </button>
      </div>
      ${
        receipts.length === 0
          ? `<div class="text-center py-12 text-gray-400">
        <svg class="w-16 h-16 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <p>No receipts yet. Upload your first receipt!</p>
      </div>`
          : `
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        ${receipts
          .map(
            (r) => `
        <div class="border border-gray-200 rounded-lg overflow-hidden receipt-thumb cursor-pointer" onclick="viewReceipt('${p.id}','${r.id}')">
          ${r.image ? `<img src="${r.image}" class="w-full h-40 object-cover" alt="receipt">` : `<div class="w-full h-40 bg-gray-100 flex items-center justify-center text-4xl">🧾</div>`}
          <div class="p-3">
            <p class="font-medium text-gray-900 text-sm truncate">${r.title || "Untitled Receipt"}</p>
            <div class="flex items-center justify-between mt-1">
              <span class="text-xs text-gray-500">${formatDate(r.createdAt)}</span>
              <span class="font-semibold text-sm text-gray-900">${formatCurrency(r.amount)}</span>
            </div>
          </div>
        </div>`,
          )
          .join("")}
      </div>`
      }
    </div>
  </div>`;
      }

      // ============ MODAL ============
      function renderModal() {
        return `
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay fade-in" onclick="if(event.target===this)closeModal()">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-auto slide-up">
      ${state.modal === "add-project" ? renderProjectForm() : ""}
      ${state.modal === "edit-project" ? renderProjectForm(state.editingProject) : ""}
      ${state.modal === "add-receipt" ? renderReceiptForm() : ""}
      ${state.modal === "view-receipt" ? renderReceiptView() : ""}
    </div>
  </div>`;
      }

      function renderProjectForm(editing) {
        const p = editing || {
          name: "",
          category: "",
          price: "",
          description: "",
          status: "active",
        };
        return `
  <div class="p-6">
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-xl font-bold text-gray-900">${editing ? "Edit Project" : "New Project"}</h3>
      <button onclick="closeModal()" class="p-2 hover:bg-gray-100 rounded-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="projectForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Project Name *</label>
        <input type="text" id="projName" required value="${p.name}" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" placeholder="e.g., Website Redesign">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
          <input type="text" id="projCategory" value="${p.category || ""}" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" placeholder="e.g., Design">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
          <select id="projStatus" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent bg-white">
            <option value="active" ${p.status === "active" ? "selected" : ""}>Active</option>
            <option value="completed" ${p.status === "completed" ? "selected" : ""}>Completed</option>
            <option value="paused" ${p.status === "paused" ? "selected" : ""}>Paused</option>
            <option value="cancelled" ${p.status === "cancelled" ? "selected" : ""}>Cancelled</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Budget / Price *</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">$</span>
          <input type="number" id="projPrice" required min="0" step="0.01" value="${p.price || ""}" class="w-full pl-8 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" placeholder="0.00">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea id="projDescription" rows="3" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition resize-none" placeholder="Optional description...">${p.description || ""}</textarea>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg font-medium hover:bg-gray-50 transition">Cancel</button>
        <button type="submit" class="flex-1 gradient-bg text-white px-4 py-2.5 rounded-lg font-semibold hover:opacity-90 transition">${editing ? "Save Changes" : "Create Project"}</button>
      </div>
    </form>
  </div>`;
      }

      function renderReceiptForm() {
        return `
  <div class="p-6">
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-xl font-bold text-gray-900">Add Receipt</h3>
      <button onclick="closeModal()" class="p-2 hover:bg-gray-100 rounded-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="receiptForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Receipt Title *</label>
        <input type="text" id="recTitle" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" placeholder="e.g., Hardware Store">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Amount *</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">$</span>
          <input type="number" id="recAmount" required min="0" step="0.01" class="w-full pl-8 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition" placeholder="0.00">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Receipt Image</label>
        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-purple-400 transition cursor-pointer" onclick="document.getElementById('recImage').click()">
          <div id="imagePreview">
            <svg class="w-10 h-10 mx-auto text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <p class="text-sm text-gray-500">Click to upload receipt image</p>
            <p class="text-xs text-gray-400 mt-1">PNG, JPG up to 5MB</p>
          </div>
          <input type="file" id="recImage" accept="image/*" class="hidden" onchange="previewImage(this)">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
        <textarea id="recNotes" rows="2" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition resize-none" placeholder="Optional notes..."></textarea>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg font-medium hover:bg-gray-50 transition">Cancel</button>
        <button type="submit" class="flex-1 gradient-bg text-white px-4 py-2.5 rounded-lg font-semibold hover:opacity-90 transition">Save Receipt</button>
      </div>
    </form>
  </div>`;
      }

      function renderReceiptView() {
        const r = state.viewingReceipt;
        if (!r) return "";
        return `
  <div class="p-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-xl font-bold text-gray-900">${r.title || "Receipt"}</h3>
      <button onclick="closeModal()" class="p-2 hover:bg-gray-100 rounded-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    ${r.image ? `<img src="${r.image}" class="w-full rounded-lg mb-4 max-h-96 object-contain bg-gray-100" alt="receipt">` : ""}
    <div class="space-y-3">
      <div class="flex justify-between py-2 border-b border-gray-100">
        <span class="text-gray-500 text-sm">Amount</span>
        <span class="font-bold text-lg text-gray-900">${formatCurrency(r.amount)}</span>
      </div>
      <div class="flex justify-between py-2 border-b border-gray-100">
        <span class="text-gray-500 text-sm">Date</span>
        <span class="text-gray-900">${formatDate(r.createdAt)}</span>
      </div>
      ${
        r.notes
          ? `<div class="py-2 border-b border-gray-100">
        <span class="text-gray-500 text-sm block mb-1">Notes</span>
        <span class="text-gray-900">${r.notes}</span>
      </div>`
          : ""
      }
    </div>
    <div class="flex gap-3 pt-4">
      <button onclick="deleteReceipt('${state.selectedProject.id}','${r.id}')" class="flex-1 px-4 py-2.5 border border-red-300 text-red-600 rounded-lg font-medium hover:bg-red-50 transition">Delete Receipt</button>
      <button onclick="closeModal()" class="flex-1 px-4 py-2.5 gradient-bg text-white rounded-lg font-semibold hover:opacity-90 transition">Close</button>
    </div>
  </div>`;
      }

      // ============ HANDLERS ============
      function attachHandlers() {
        const loginForm = document.getElementById("loginForm");
        if (loginForm) {
          loginForm.onsubmit = (e) => {
            e.preventDefault();
            login(
              document.getElementById("loginEmail").value,
              document.getElementById("loginPassword").value,
            );
          };
        }
        const goRegister = document.getElementById("goRegister");
        if (goRegister)
          goRegister.onclick = () => setState({ view: "register" });
        const goLogin = document.getElementById("goLogin");
        if (goLogin) goLogin.onclick = () => setState({ view: "login" });
        const registerForm = document.getElementById("registerForm");
        if (registerForm) {
          registerForm.onsubmit = (e) => {
            e.preventDefault();
            register(
              document.getElementById("regName").value,
              document.getElementById("regEmail").value,
              document.getElementById("regPassword").value,
            );
          };
        }
        const searchInput = document.getElementById("searchInput");
        if (searchInput) {
          searchInput.oninput = (e) =>
            setState({ searchQuery: e.target.value });
        }
        const filterSelect = document.getElementById("filterSelect");
        if (filterSelect) {
          filterSelect.onchange = (e) => setState({ filter: e.target.value });
        }
        const projectForm = document.getElementById("projectForm");
        if (projectForm) {
          projectForm.onsubmit = (e) => {
            e.preventDefault();
            const data = {
              name: document.getElementById("projName").value.trim(),
              category: document.getElementById("projCategory").value.trim(),
              price:
                parseFloat(document.getElementById("projPrice").value) || 0,
              description: document
                .getElementById("projDescription")
                .value.trim(),
              status: document.getElementById("projStatus").value,
            };
            if (state.modal === "edit-project") {
              updateProject({ ...state.editingProject, ...data });
            } else {
              addProject(data);
            }
          };
        }
        const receiptForm = document.getElementById("receiptForm");
        if (receiptForm) {
          receiptForm.onsubmit = (e) => {
            e.preventDefault();
            const imgEl = document.getElementById("recImage");
            const addRec = (imgData) => {
              addReceipt(state.receiptProjectId, {
                title: document.getElementById("recTitle").value.trim(),
                amount:
                  parseFloat(document.getElementById("recAmount").value) || 0,
                notes: document.getElementById("recNotes").value.trim(),
                image: imgData || null,
              });
            };
            if (imgEl.files && imgEl.files[0]) {
              const reader = new FileReader();
              reader.onload = (ev) => addRec(ev.target.result);
              reader.readAsDataURL(imgEl.files[0]);
            } else {
              addRec(null);
            }
          };
        }
      }

      // ============ ACTIONS ============
      window.navigateTo = (view) => {
        setState({ view, sidebarOpen: false });
      };
      window.toggleSidebar = () =>
        setState({ sidebarOpen: !state.sidebarOpen });
      window.openAddProject = () => setState({ modal: "add-project" });
      window.openEditProject = (id) => {
        const p = state.projects.find((x) => x.id === id);
        if (p) setState({ modal: "edit-project", editingProject: p });
      };
      window.openAddReceipt = (pid) =>
        setState({ modal: "add-receipt", receiptProjectId: pid });
      window.viewProject = (id) => {
        const p = state.projects.find((x) => x.id === id);
        if (p)
          setState({
            view: "project-detail",
            selectedProject: p,
            sidebarOpen: false,
          });
      };
      window.viewReceipt = (pid, rid) => {
        const receipts = DB.getReceipts(state.user.id, pid);
        const r = receipts.find((x) => x.id === rid);
        if (r) setState({ modal: "view-receipt", viewingReceipt: r });
      };
      window.closeModal = () =>
        setState({ modal: null, editingProject: null, viewingReceipt: null });

      window.previewImage = (input) => {
        if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const preview = document.getElementById("imagePreview");
            if (preview)
              preview.innerHTML = `<img src="${e.target.result}" class="max-h-40 mx-auto rounded-lg"><p class="text-xs text-green-600 mt-2">✓ Image loaded</p>`;
          };
          reader.readAsDataURL(input.files[0]);
        }
      };

      // ============ INIT ============
      if (state.user) {
        state.projects = DB.getProjects(state.user.id);
        state.view = "dashboard";
      }
      render();
    </script>
  </body>
</html>
